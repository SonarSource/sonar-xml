name: Unified Dogfooding scans
on:
  schedule:
    - cron: "0 4 * * 1-5" # Run the workflow Mon-Fri at 04:00 UTC
  workflow_dispatch:

jobs:
  unified-platform-dogfooding:
    runs-on: github-ubuntu-latest-s
    name: Unified Platform Dogfooding
    permissions:
      id-token: write
      contents: write  # Required by ci-github-actions v2 get-build-number (creates Git refs)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.0
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          run-shadow-scans: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: org.sonarsource.xml:xml
          primary_platform: "Next"
          shadow1_project_key: org.sonarsource.xml:xml
          shadow1_platform: "SQC-EU"
          shadow2_project_key: org.sonarsource.xml:xml
          shadow2_platform: "SQC-US"
